<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/favicon-180.png"/>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Board · PURPLE</title>
<link rel="stylesheet" href="dds-chrome.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
body{background:#0b0706;color:#f0e6d2;font-family:Inter,sans-serif;margin:0}
main{max-width:1180px;margin:1.2rem auto 3rem;padding:0 1.2rem}
h1{font-family:"Playfair Display",Georgia,serif;color:#e9d5ff;margin:.2rem 0}
.hint{color:#b9a68a;line-height:1.5}
.jumps{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.jumps a{border:1px solid #b794f6;color:#edd8ff;text-decoration:none;padding:.4rem .7rem;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
#promo{display:none;border:1px solid #b794f6;background:#2a1410;color:#edd8ff;padding:.75rem 1rem;margin:0 0 1rem;font-weight:600}
#promo.on{display:block}
.wire{margin:.85rem 0 1rem;padding:.85rem 1rem;border:1px solid #5b3a78;background:linear-gradient(180deg,#1a0f24,#120814);border-radius:14px}
.wire-k{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#d8b4fe;font-weight:800;margin:0 0 .2rem}
.wire-when{margin:0 0 .55rem;color:#9a8a70;font-size:.72rem}
.wire ul{margin:0;padding:0;list-style:none}
.wire li{position:relative;padding:.28rem 0 .28rem 1.1rem;color:#f3e9d7;font-size:.9rem;line-height:1.4;border-top:1px solid rgba(183,148,246,.12)}
.wire li:first-child{border-top:0}
.wire li:before{content:"▸";position:absolute;left:0;color:#c4b5fd}
.status-busy{color:#ff8a8a;font-size:.72rem;font-weight:700;margin-left:.35rem}
.race-card{border:1px solid #5a3f28;background:#140e0c;border-radius:14px;padding:1rem .9rem 1.1rem;margin:.8rem 0}
.race-scale{position:relative;height:38px;margin:0 0 .85rem 86px;border-bottom:1px dashed rgba(212,175,55,.35)}
.race-scale i{position:absolute;top:0;height:100%;border-left:1px solid rgba(212,175,55,.45);transform:translateX(-50%);min-width:3.2rem}
.race-scale b{display:block;padding-left:5px;font-size:.62rem;color:#f3e6c8;letter-spacing:.04em;font-weight:800;white-space:nowrap}
.race-scale em{display:block;padding-left:5px;font-size:.52rem;color:#c9a878;font-style:normal;letter-spacing:.03em}
.race-row{display:flex;gap:.75rem;align-items:center;text-decoration:none;color:inherit;padding:.55rem .2rem;border-radius:10px}
.race-row:hover{background:rgba(245,215,110,.06)}
.race-1{background:linear-gradient(90deg,rgba(245,215,110,.12),transparent 70%)}
.race-face{flex:0 0 64px;width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid #b794f6;box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.race-1 .race-face{border-color:#edd8ff;box-shadow:0 0 16px rgba(245,215,110,.35)}
.race-face img{width:100%;height:100%;object-fit:cover;display:block}
.race-meta{flex:1;min-width:0}
.race-top{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.race-top strong{color:#fff6d8;font-size:.98rem}
.race-top .rank{font-weight:800;color:#b794f6;min-width:1.6rem}
.rank-1{color:#ffd700}
.score{margin-left:auto;font-style:normal;font-weight:800;color:#d8b4fe;font-size:1.05rem}
.race-track{height:10px;margin:.35rem 0 .25rem;background:#2a1c16;border-radius:99px;overflow:hidden;border:1px solid #5a3f28}
.race-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8a5a12,#e8c45a 55%,#fff4c4)}
.race-1 .race-fill{background:linear-gradient(90deg,#9b6bdb,#ffe08a,#fffdf2)}
.race-2 .race-fill{background:linear-gradient(90deg,#6a5330,#d4c4a0)}
.race-3 .race-fill{background:linear-gradient(90deg,#5a3a28,#c9a078)}
.race-sub{font-size:.68rem;color:#b9a68a;letter-spacing:.02em}
.tier{display:inline-block;padding:.12rem .5rem;border-radius:999px;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tier-sovereign{background:linear-gradient(135deg,#fffdf2,#e8c45a);color:#2a1608}
.tier-crown{background:#fff6c8;color:#3a2208}
.tier-super{background:#ff4f8a;color:#fff}
.tier-elite{background:#b794f6;color:#1a0a0a}
.tier-top{border:1px solid #b794f6;color:#b794f6}
.tier-strong{border:1px solid #7dcea0;color:#7dcea0}
.tier-good{border:1px solid #85c1e9;color:#85c1e9}
.tier-new{border:1px solid #888;color:#bbb}
.tier-up{animation:upflash 1.6s ease-in-out 4}
@keyframes upflash{0%,100%{background:transparent}50%{background:rgba(212,175,55,.22)}}
@media (max-width:640px){
  .race-scale{margin-left:0}
  .race-face{flex-basis:48px;width:48px;height:48px}
}
</style>
</head>
<body>
<main>
  <p class="section-label">Club desk</p>
  <h1>Desire race</h1>
  <p class="hint" id="raceLead">Bars follow the live slabs.</p>
  <section class="wire" id="raceWire">
    <div class="wire-k">Floor report</div>
    <p class="wire-when" id="raceWireWhen"></p>
    <ul id="raceWireList"><li>Desk is reading the board…</li></ul>
  </section>
  <div class="jumps">
    <a href='/club'>Board</a>
    
    <a href='/offer'>Offers</a>
    <a href='/rate'>Rate a session</a>
  </div>
  <div id="promo"></div>
  <section id="board" class="race-card">
    <div id="dds-live-board" class="hint">Loading board…</div>
  </section>
</main>
<script src="supabase-config.js"></script>
<script src="dds-config.js"></script>
<script src="dds-chrome.js?v=20261023own"></script>
</body>
</html>
