<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/favicon-180.png"/>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Player lounge · PURPLE</title>
  <link rel="stylesheet" href="dds-chrome.css"/>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600;800&display=swap");
    body{margin:0;background:#120814;color:#f3e9d7;font-family:Inter,sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:1.1rem 1rem 3rem}
    h1{font-family:"Playfair Display",Georgia,serif;color:#e9d5ff;margin:.1rem 0 .25rem;font-size:1.7rem}
    .hint{color:#b9a892;line-height:1.45;font-size:.88rem}
    .card{background:#160e1c;border:1px solid #4a2c5f;border-radius:12px;padding:.75rem .85rem;margin:.55rem 0}
    #startBox{padding:.55rem .7rem}
    #startBox b{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:#d8b4fe}
    .compose{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:center;margin-top:.35rem}
    #topicTitle{margin:0}
    #topicBody{display:none;grid-column:1 / -1;min-height:70px;margin:0}
    #startBox.open #topicBody{display:block}
    input,textarea,button{width:100%;box-sizing:border-box;padding:.45rem .6rem;border-radius:8px;border:1px solid #5a3f68;background:#120814;color:#f3e9d7;font:inherit;margin:.15rem 0}
    button{width:auto;background:#6d28d9;border-color:#b794f6;color:#f6e7ff;font-weight:800;cursor:pointer;white-space:nowrap}
    button.ghost{background:transparent;color:#e9d5ff}
    a{color:#d8b4fe}
    .board{width:100%;border-collapse:collapse;background:#160e1c;border:1px solid #4a2c5f;border-radius:12px;overflow:hidden}
    .board th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#d8b4fe;padding:.55rem .7rem;border-bottom:1px solid #4a2c5f;background:#1a1022}
    .board td{padding:.55rem .7rem;border-bottom:1px solid #2c1c38;color:#ead9be;vertical-align:middle}
    .board tr.line{cursor:pointer}
    .board tr.line:hover td{background:#1e1228}
    .board tr.open td{background:#22142e;border-bottom-color:#b794f6}
    .board .topic{color:#edd8ff;font-weight:700}
    .board .who,.board .n{color:#b9a892;font-size:.84rem;white-space:nowrap}
    .board .n{text-align:right}
    .expand td{background:#120814;padding:.2rem .7rem .85rem}
    .expand .inner{display:none}
    tr.open + .expand .inner{display:block}
    .reply{border-left:2px solid #6d28d9;padding:.35rem .65rem;margin:.35rem 0}
    .reply.house{border-left-color:#f5d0fe;background:#2a1438;border-radius:8px}
    .reply.house b{color:#f5d0fe}
    .thread-op{color:#ead9be;line-height:1.45;margin:.55rem 0 .3rem}
    @media(max-width:640px){.compose{grid-template-columns:1fr}.board .who{display:none}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>Player lounge</h1>
  <p class="hint">Open a topic. Others answer. You can delete a thread you started. Verified members only. <a href="account.html?inbox=1">Private inbox</a></p>
  <p><a class="ghost" id="deskGoLink" href="account.html?admin=1" style="display:inline-block;padding:.45rem .75rem;border:1px solid #b794f6;border-radius:8px;font-weight:800;text-decoration:none">Send to admin</a></p>
  <div class="card" id="startBox">
    <b>New topic</b>
    <div class="compose">
      <input id="topicTitle" maxlength="80" placeholder="Subject"/>
      <button type="button" id="topicGo">Post</button>
      <textarea id="topicBody" maxlength="400" placeholder="First post. 400 characters."></textarea>
    </div>
    <p class="hint" id="topicNote"></p>
  </div>
  <div id="topicList" class="hint">Loading…</div>
</main>
<script src="supabase-config.js"></script>
<script src="dds-chrome.js?v=20261023own4"></script>
<script src="dds-forum.js?v=251001a"></script>
</body>
</html>
