<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Honor board · Desire Syndicate</title>
  <link rel="icon" type="image/png" href="favicon-32.png"/>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600;800&display=swap");
    :root { --bg:#0a0809; --card:#140e16; --text:#f3e9d7; --muted:#b9a892; --accent:#c084fc; --border:#5a3a6a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
    .wrap { max-width:760px; margin:0 auto; padding:1.5rem 1.1rem 3.5rem; }
    .top { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; flex-wrap:wrap; }
    h1 { font-family:"Playfair Display",Georgia,serif; color:var(--accent); margin:0; font-size:1.7rem; }
    .hint { color:var(--muted); line-height:1.5; margin:.45rem 0 1rem; }
    a.back { color:var(--accent); text-decoration:none; font-size:.85rem; font-weight:700; }
    .grid { display:grid; gap:.7rem; }
    .card { display:block; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1rem 1.1rem; text-decoration:none; color:inherit; }
    .card:hover { border-color:var(--accent); }
    .name { font-family:"Playfair Display",Georgia,serif; font-size:1.2rem; color:#f0d4ff; margin:0 0 .35rem; }
    .pill { display:inline-block; margin:0 .3rem .3rem 0; padding:.18rem .55rem; border-radius:999px; background:#2a1638; border:1px solid var(--accent); color:#f0d4ff; font-size:.7rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .about { color:var(--muted); font-size:.88rem; line-height:1.45; margin:.4rem 0 .5rem; }
    .empty { color:var(--muted); padding:1.2rem 0; }
  </style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>Honor board</h1>
    <a class="back" href="https://desireclubhouse.netlify.app/">House</a>
  </div>
  <p class="hint">Silver and above. Name, status, about, favorites. Click a card.</p>
  <div id="list" class="grid"><p class="empty">Loading…</p></div>
</main>
<script src="supabase-config.js"></script>
<script>
(function () {
  var NAMES = {preethi:"Preethi",diya:"Diya",meghana:"Meghana",kiara:"Kiara",sravani:"Sravani",meenakshi:"Meenakshi",ayesha:"Ayesha",esther:"Esther",natasha:"Natasha",tharini:"Tharini",kavya:"Kavya"};
  var box = document.getElementById("list");
  var cfg = window.DDS_SUPABASE || {};
  var url = String(cfg.url || "https://axavugukoesqkfykprur.supabase.co").replace(/\/$/, "");
  var anon = cfg.anon || "sb_publishable_lTzYnhvWF0JRNnAitqfszw_ctUL1t4I";
  fetch(url + "/rest/v1/rpc/honor_board", {
    method: "POST",
    headers: { apikey: anon, Authorization: "Bearer " + anon, "Content-Type": "application/json" },
    body: "{}"
  }).then(function (r) { return r.json(); }).then(function (d) {
    var rows = (d && d.players) || (Array.isArray(d) ? d : []);
    if (!rows.length) { box.innerHTML = "<p class='empty'>No Silver+ cards yet.</p>"; return; }
    box.innerHTML = rows.map(function (p) {
      var favs = [p.fav1, p.fav2].filter(Boolean).map(function (s) {
        return '<span class="pill">' + (NAMES[s] || s) + "</span>";
      }).join(" ") || "<span class='hint'>No favorites locked</span>";
      var href = "member.html?u=" + encodeURIComponent(p.username || "");
      return '<a class="card" href="' + href + '">' +
        '<div class="name">' + String(p.name || p.username || "").replace(/</g,"") + "</div>" +
        '<span class="pill">' + String(p.status || "").replace(/</g,"") + "</span>" +
        "<p class='about'>" + String(p.about || "No about yet.").replace(/</g,"") + "</p>" +
        "<div>" + favs + "</div></a>";
    }).join("");
  }).catch(function () {
    box.innerHTML = "<p class='empty'>Honor board could not load.</p>";
  });
})();
</script>
</body>
</html>
