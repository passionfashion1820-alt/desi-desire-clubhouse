<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/favicon-180.png"/>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stuck Mid-Game? | Desi Desire Syndicate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0d0a0a;
    color: #f5e6d3;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .poster {
    width: 100%;
    max-width: 520px;
    background: linear-gradient(165deg, #1a1212 0%, #0f0b0b 100%);
    border: 1px solid #5c2e2e;
    border-radius: 16px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 0 60px rgba(120, 30, 30, 0.25);
    position: relative;
    overflow: hidden;
  }

  .poster::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #c9a227, transparent);
  }

  .top-label {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #c9a227;
    margin-bottom: 28px;
    font-weight: 500;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
    line-height: 1.25;
  }

  .subtitle {
    font-size: 15px;
    color: #d4b896;
    margin-bottom: 36px;
    font-weight: 300;
  }

  .command-box {
    background: rgba(201, 162, 39, 0.08);
    border: 1px solid rgba(201, 162, 39, 0.35);
    border-radius: 10px;
    padding: 22px 20px;
    margin-bottom: 32px;
  }

  .command {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: #c9a227;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .desc {
    font-size: 15px;
    line-height: 1.75;
    color: #e8d5c0;
    margin-bottom: 28px;
  }

  .desc strong {
    color: #fff;
  }

  .footer {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8a6d4f;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="top-label">Desi Desire Syndicate</div>
    
    <h1>Stuck Mid-Game?</h1>
    <div class="subtitle">Already playing and need guidance?</div>

    <div class="command-box">
      <div class="command">#HELP</div>
    </div>

    <div class="desc">
      If you’re in the middle of a session<br>
      and feel stuck, confused, or unsure<br>
      what to say next — just type <strong>#HELP</strong>.<br><br>
      Desire Scout will answer your questions<br>
      without breaking your current game.
    </div>

    <div class="footer">Desi Desire Gentlemen’s Club</div>
  </div>
</body>
</html>
