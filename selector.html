/* Meenakshi is a trainer, not a lineup door. */
const SOON = { chandana: "soon", aleena: "soon" };
const BOARD = {};

function tierOf(score) {
  score = Number(score || 0);
  if (score >= 3000) return "queen";
  if (score >= 2500) return "crown";
  if (score >= 2000) return "elite";
  if (score >= 1500) return "elite";
  if (score >= 1200) return "top";
  if (score >= 1000) return "strong";
  if (score >= 750) return "good";
  return "new";
}
function tierName(key) {
  return { queen:"Desire Queen", crown:"Desire Crown", elite:"Desire Elite", top:"Top", strong:"Strong", good:"Good", new:"New" }[key] || "New";
}
function isSoon(id) { return !!SOON[id]; }

function loadBoard() {
  var cfg = window.DDS_SUPABASE || {};
  if (!cfg.url || !cfg.anon) return;
  fetch(String(cfg.url).replace(/\/$/, "") + "/rest/v1/board?select=slut,desire_score,hearts,sessions,reviews&order=desire_score.desc", {
    headers: { apikey: cfg.anon, Authorization: "Bearer " + cfg.anon }
  }).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
    (rows || []).forEach(function (row, i) {
      BOARD[String(row.slut || "").toLowerCase()] = {
        score: Number(row.desire_score || 0),
        hearts: Number(row.hearts || 0),
        sessions: Number(row.sessions || 0),
        reviews: Number(row.reviews || 0),
        rank: i + 1,
        tier: tierOf(row.desire_score)
      };
    });
  }).catch(function () {});
}
loadBoard();

function score(s, q) {
  var n = 1; // base so no model is zero
  var vibe = Array.isArray(s.vibe) ? s.vibe : [];
  var tags = Array.isArray(s.bodyTag) ? s.bodyTag : [];
  var keys = String(s.keys || "").toLowerCase();
  var b = BOARD[s.id] || { sessions: 0, rank: 99 };
  if (q.diff === "any") n += 1;
  else if (s.diff === q.diff) n += 5;
  else if ((q.diff === "medium" && s.diff !== "hard") || (q.diff === "easy" && s.diff === "medium")) n += 2;
  if (q.vibe === "any") n += 1;
  else if (vibe.indexOf(q.vibe) !== -1) n += 5;
  else if (q.vibe === "control" && (vibe.indexOf("proud") !== -1 || keys.indexOf("control") !== -1)) n += 3;
  if (q.age === "any") n += 1;
  else if (q.age === "mature" && s.age >= 40) n += 3;
  else if (q.age === "mid" && s.age <= 38) n += 2;
  if (q.body === "any") n += 1;
  else if (tags.indexOf(q.body) !== -1) n += 4;
  var nights = Number(b.sessions || 0);
  if (q.exp === "high" && nights >= 100) n += 4;
  else if (q.exp === "high" && nights >= 50) n += 2;
  else if (q.exp === "new" && nights < 50) n += 3;
  else if (q.exp === "any") n += 1;
  if (q.note) {
    var k = q.note.toLowerCase();
    if (keys.indexOf(k) !== -1 || String(s.name||"").toLowerCase().indexOf(k) !== -1 || String(s.origin||"").toLowerCase().indexOf(k) !== -1) n += 6;
    k.split(/\s+/).forEach(function (w) { if (w.length > 2 && keys.indexOf(w) !== -1) n += 2; });
  }
  return n;
}

document.getElementById("go").onclick = function () {
  var q = {
    diff: document.getElementById("diff").value,
    vibe: document.getElementById("vibe").value,
    age: document.getElementById("age").value,
    body: document.getElementById("body").value,
    exp: document.getElementById("exp") ? document.getElementById("exp").value : "any",
    door: document.getElementById("door").value,
    race: document.getElementById("race").value,
    rank: document.getElementById("rank").value,
    note: (document.getElementById("note").value || "").trim()
  };

  var pool = SLUTS.filter(function (s) {
    var soon = isSoon(s.id);
    if (q.door === "live" && soon) return false;
    if (q.door === "soon" && !soon) return false;
    var b = BOARD[s.id] || { score: 0, rank: 99, tier: "new" };
    if (q.race !== "any") {
      var order = ["new","good","strong","top","elite","crown","queen"];
      if (order.indexOf(b.tier) < order.indexOf(q.race)) return false;
    }
    if (q.rank !== "any" && b.rank > Number(q.rank)) return false;
    return true;
  });

  var ranked = pool.map(function (s) { return { s: s, n: score(s, q) }; })
    .sort(function (a, b) { return b.n - a.n || (BOARD[b.s.id]||{}).sessions - (BOARD[a.s.id]||{}).sessions || a.s.name.localeCompare(b.s.name); })
    .slice(0, 3);

  var box = document.getElementById("results");
  box.style.display = "block";
  if (!ranked.length) {
    box.innerHTML = '<p class="res-title">No match</p><p class="note">That slab or rank is empty. Widen the Desire filter.</p>';
    return;
  }
  box.innerHTML = '<p class="res-title">Your matches</p>' + ranked.map(function (r, i) {
    var thumb = (window.DDS_THUMBS && window.DDS_THUMBS[r.s.id]) || "";
    var b = BOARD[r.s.id] || {};
    var open = isSoon(r.s.id) ? (SOON[r.s.id] === "soon" ? "Coming soon" : "Opens " + SOON[r.s.id].slice(8) + " Oct") : "Live";
    var race = b.tier ? tierName(b.tier) + " · " + Math.round(b.score || 0) : "Score loading";
    var rank = b.rank ? "Rank #" + b.rank : "";
    return '<article class="pick">'
      + (thumb ? '<img class="thumb" src="' + thumb + '" alt="' + r.s.name + '">' : '<div></div>')
      + '<div><div class="tag">' + (i === 0 ? "Best fit" : "Also try") + '</div>'
      + '<h3>' + r.s.name + '</h3>'
      + '<p class="meta">' + r.s.age + ' · ' + r.s.body + ' · ' + r.s.origin + ' · ' + (r.s.title || "") + '</p>'
      + '<p class="meta">' + [open, rank, race, b.hearts ? b.hearts + " hearts" : "", b.sessions ? b.sessions + " nights" : ""].filter(Boolean).join(" · ") + '</p>'
      + '<p class="why">' + (r.s.why || "") + '</p>'
      + '<p class="note">Open her profile. Click to Play lives there.</p>'
      + '<a class="btn" href="' + r.s.id + '.html">View profile</a>'
      + '</div></article>';
  }).join("");
  box.scrollIntoView({ behavior: "smooth", block: "start" });

  var list = window.DDS_LIVE_OFFERS || [];
  var hook = document.getElementById("offerHook");
  if (hook) {
    var hits = ranked.map(function (r) { return r.s.name.toLowerCase(); });
    var matched = list.filter(function (o) { return hits.indexOf(String(o.name||"").toLowerCase()) !== -1; });
    if (matched.length) {
      hook.style.display = "block";
      hook.innerHTML = matched.map(function (off) {
        return "OFFER · " + off.name + " · <strong>" + off.code + "</strong> — " + off.perks +
          ' · <a href="' + off.slug + '.html">View profile</a>';
      }).join("<br>");
    } else {
      hook.style.display = "none";
    }
  }
};

document.getElementById("reset").onclick = function () {
  document.getElementById("sel").reset();
  document.getElementById("results").style.display = "none";
  var hook = document.getElementById("offerHook");
  if (hook) hook.style.display = "none";
};
</script>
