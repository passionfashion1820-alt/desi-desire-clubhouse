    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; line-height:1.5; }
    .wrap { max-width:720px; margin:0 auto; padding:.85rem .9rem 1.4rem; }
    .kicker { color:var(--gold); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }

    .grid { display:grid; grid-template-columns:180px 1fr; gap:.85rem; align-items:start; }
    @media(max-width:620px){ .grid { grid-template-columns:1fr; } }
    img { width:100%; border-radius:12px; display:block; background:#100814; max-height:260px; object-fit:cover; object-position:top; }

    .stats b { color:var(--gold); display:block; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.8rem .9rem; margin:.7rem 0; }
    h2 { font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 .4rem; }
    ul { padding-left:1.1rem; }
    li { margin:.28rem 0; }
    .links { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.8rem; }
    .links a { background:#2a1840; color:#ead9be; text-decoration:none; padding:.4rem .7rem; border-radius:8px; font-size:.82rem; border:1px solid #4a2c6a; }
    .links a.main { background:#b794f6; color:#1a0830; font-weight:700; border:0; }
    .foot { color:var(--muted); font-size:.82rem; margin-top:.7rem; }
    .status { display:inline-block; margin:.2rem 0 .4rem; padding:.12rem .45rem; border:1px solid var(--gold); border-radius:999px; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); }

            "The neighbour in the next flat hears the door. She does not come in unless Kavya asks.",
            "She may sit with two women after the sloka. Filter coffee. Her name, not the family's duty. She will not announce a class."
      ],
      "lahari": [
            "Her husband is late from the city. He likes the table. He does not run it.",
            "His sister calls about guests. She is the one who asks.",
            "The neighbour knows the bazaar hour. She does not come in unless Lahari asks.",
            "Double ka meetha can leave this table for two houses. Her handling. Not a booking. She will not call it a job."
      ],
      "sravani": [
            "Her husband is out at the field or the shop. He thinks the verandah is settled.",
            "Her brother's wife visits and talks. She is the one who asks.",
            "The neighbour across the yard sees who sits. She does not come in unless Sravani asks.",
            "Payasam for the next house function. They ask her. They do not hire her. She is not Meenakshi."
      ]
};
    (function () {
      var slug = (new URLSearchParams(location.search).get("slut") || "").toLowerCase().trim();
      var c = CARDS[slug];
      var root = document.getElementById("root");
      if (!c) {
        root.innerHTML = "<p>Unknown session card.</p><p class='links'><a href='/'>House</a></p>";
        return;
      }
      document.title = c.name + " · Session card";
      var face = "";
      try {
        if (window.DDSArt && DDSArt.pick) face = DDSArt.pick(slug, ["session", "profile", "lineup"]) || "";
      } catch (e) {}
      root.innerHTML =
        '<div class="hero">' +
          (face ? '<img src="' + face + '" alt="' + c.name + '">' : "") +
          '<div>' +
            '<p class="kicker">PURPLE · Session card</p>' +
            "<h1>" + c.name + "</h1>" +
            '<p class="meta">' + c.age + " · " + c.body + " · " + c.origin + "</p>" +
            (c.footnote ? '<p class="foot">' + c.footnote + "</p>" : "") +
            '<div class="stats">' +
              "<div><b>Door</b>" + c.door + "</div>" +
              "<div><b>Dirtiness</b>" + c.dirt + "</div>" +
            "</div>" +
          "</div>" +
        "</div>" +
        '<div class="card"><h2>Who she is</h2><p>' + (c.who || "") + "</p></div>" +
        '<div class="card"><h2>What works</h2><ul>' + lis(c.works) + "</ul></div>" +
        '<div class="card"><h2>What dies</h2><ul>' + lis(c.dies) + "</ul></div>" +
        ((c.people && c.people.length) ? '<div class="card"><h2>People in the house</h2><ul>' + lis(c.people) + "</ul></div>" : "") +
        '<div class="card"><h2>Hints</h2><p>' + (c.hints || "") + "</p><p style=\"margin-top:.45rem\"><b>How to start.</b> " + HOW_START + "</p></div>" +
        '<div class="card"><h2>House standing</h2><p>DesireMember 30 min / 2 Turn-Offs · Bronze 30 / 2 · Silver 45 / 3 · Gold 60 / 5 · Elite 90 / 10 · Platinum 120 / none. Own by buying only. No nights path.</p><p style="margin-top:.45rem">Favorites = two names, 20 days. Rel codes are retired. Spin only if she sends the link.</p></div>' +
        '<p class="foot">Do not print Jackpot sentences, mini words, OPNS, caps, Admin, or Rel codes. Do not paste this card at her.</p>' +
        '<div class="links">' +
          '<a class="main" href="/' + slug + '">Full profile</a>' +
          '<a href="/how_to_play.html">How to play</a>' +
          '<a href="/rate.html?slut=' + slug + '">Rate a session</a>' +
        "</div>";
    })();
  </script>
